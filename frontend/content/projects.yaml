      de: "<p>Python &middot; Vue.js &middot; D3.js&nbsp;</p>\n<ul>\n<li>Basierend auf offenen Daten von <a href=\"https://www.parlament.ch/\" target=\"_blank\" rel=\"noopener\">parlament.ch</a></li>\n<li>Showcase auf <a href=\"https://opendata.swiss/de/showcase/visualisierung-des-schweizer-national-und-standerats\" target=\"_blank\" rel=\"noopener\">opendata.swiss</a></li>\n</ul>\n<p>#Organisation #Publikation</p>"
      en: "<p>Python &middot; Vue.js &middot; D3.js</p>\n<ul>\n<li>Based on open data from <a href=\"https://www.parlament.ch/\" target=\"_blank\" rel=\"noopener\">parlament.ch</a></li>\n<li>Showcase on <a href=\"https://opendata.swiss/en/showcase/visualisierung-des-schweizer-national-und-standerats\" target=\"_blank\" rel=\"noopener\">opendata.swiss</a></li>\n</ul>\n<p>#Organization #Publication</p>"

