      en: "<p>R &middot; Vue.js &middot; D3.js&nbsp;</p>\n<ul>\n<li>Based on data from <a href=\"https://data.bs.ch/pages/home/\" target=\"_blank\" rel=\"noopener\">Open Data Basel-Stadt</a></li>\n</ul>\n<p>#Organization #Publication</p>"

  - url: https://money-and-citations.kmapper.com/
    urlText: money-and-citations.kmapper.com
    image: /images/project-money-and-citations.png
    title:
      de: "Does Money Buy Citations?"
