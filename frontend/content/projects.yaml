items:
  - url: https://geschichte.kibue.ch/
    urlText: geschichte.kibue.ch
    image: /images/project-kibue-history.png
    title:
      de: "Geschichte des Kinderbüros Basel"
      en: "History of the Kinderbüro Basel"
    description:
      de: "Die Geschichte des Kinderbüros Basel per Panning über Kacheln entdecken."
      en: "Discover the history of the Basel Kinderbüro by panning across tiles."
    notes:
      de: "<p>Vue.js</p>\n<ul>\n<li>Konzept und Design: <a href=\"https://www.hejkarlie.ch\" target=\"_blank\" rel=\"noopener\">Karlie GmbH</a></li>\n<li>Basierend auf dem Archiv des <a href=\"https://kibue.ch\" target=\"_blank\" rel=\"noopener\">Kinderb&uuml;ros</a></li>\n</ul>\n<p>#Publikation</p>"
      en: "<p>Vue.js</p>\n<ul>\n<li>Concept and Design: <a href=\"https://www.hejkarlie.ch\" target=\"_blank\" rel=\"noopener\">Karlie GmbH</a></li>\n<li>Based on <a href=\"http://kibue.ch\" target=\"_blank\" rel=\"noopener\">Kinderb&uuml;ro's</a> archive</li>\n</ul>\n<p>#Publication</p>"

  - url: https://data.governance-advisors.ch/
    urlText: data.governance-advisors.ch
    image: /images/project-governance-advisors.png
    title:
      de: "Merkmale der SMI-Verwaltungsräte"
      en: "Characteristics of SMI Board Directors"
    description:
      de: "Die dynamische Heatmap zeigt, wie sich die Zusammensetzung der SMI-Verwaltungsräte im Laufe der Zeit verändert hat."
      en: "The dynamic heat map shows how SMI board composition has changed over time."
    notes:
      de: "<p>R &middot; Vue.js &middot; D3.js</p>\n<ul>\n<li>Basierend auf aggregierten Daten der <a href=\"https://governance-advisors.ch/daten/\" target=\"_blank\" rel=\"noopener\">Governance Advisors AG</a></li>\n</ul>\n<p>#Organisation #Publikation</p>"
      en: "<p>R &middot; Vue.js &middot; D3.js</p>\n<ul>\n<li>Based on aggregated data from <a href=\"https://governance-advisors.ch/daten/\" target=\"_blank\" rel=\"noopener\">Governance Advisors AG</a></li>\n</ul>\n<p>#Organization #Publication</p>"

  - url: https://pypi.org/project/kmapper-iscc-scan/
    urlText: kmapper-iscc-scan
    image: /images/project-iscc-scan.png
    title:
      de: "ISCC Inventar-Tool"
      en: "ISCC Inventory Tool"
    description:
      de: "Das Tool scannt Verzeichnisse, generiert ISCCs und clustert automatisch: (1) Identische Kopien (bitgenau, egal welcher Dateiname), (2) Ähnliche Inhalte (verschiedene Dateien mit ähnlichem Inhalt landen im selben Cluster)"
      en: "The tool scans directories, generates ISCCs, and automatically clusters: (1) Identical copies (bit-for-bit, regardless of filename), (2) Similar content (different files with similar content end up in the same cluster)"
    notes:
      de: "<p>Python</p>\n<ul>\n<li>Basierend auf dem <a href=\"https://iscc.io/\" target=\"_blank\" rel=\"noopener\">ISCC</a> der ISCC Foundation</li>\n</ul>\n<p>#Kuration #Organisation</p>"
      en: "<p>Python</p>\n<ul>\n<li>Based on the ISCC Foundation's <a href=\"https://iscc.io/\" target=\"_blank\" rel=\"noopener\">ISCC</a></li>\n</ul>\n<p>#Curation #Organization</p>"

  - url: https://grosserrat-bs.kmapper.ch/
    urlText: grosserrat-bs.kmapper.ch
    image: /images/project-grosserrat-bs.png
    title:
      de: "Grosser Rat Basel-Stadt"
      en: "Grand Council of Basel-Stadt"
    description:
      de: "Die dynamische Visualisierung zeigt die Sitzverteilung der Mitglieder des Grossen Rates Basel-Stadt in Relation zu einem zusätzlich wählbaren Merkmal."
      en: "The dynamic visualization shows the distribution of seats for members of the Grand Council of Basel-Stadt in relation to an additional feature."
    notes:
      de: "<p>Vue.js &middot; D3.js</p>\n<ul>\n<li>Basierend auf f&uuml;nf Datens&auml;tzen von <a href=\"https://data.bs.ch/pages/home/\" target=\"_blank\" rel=\"noopener\">Open Data Basel-Stadt</a></li>\n</ul>\n<p>#Kuration #Organisation #Publikation</p>"
      en: "<p>Vue.js &middot; D3.js</p>\n<ul>\n<li>Based on five data sets from <a href=\"https://data.bs.ch/pages/home/\" target=\"_blank\" rel=\"noopener\">Open Data Basel-Stadt</a></li>\n</ul>\n<p>#Curation #Organization #Publication</p>"

