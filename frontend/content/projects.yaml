    notes:
      de: "<p>&nbsp;R &middot; Vue.js &middot; D3.js&nbsp;</p>\n<ul>\n<li>Basierend auf Daten von <a href=\"https://data.snf.ch/datasets\" target=\"_blank\" rel=\"noopener\">SNF</a> und <a href=\"https://www.crossref.org/\" target=\"_blank\" rel=\"noopener\">Crossref</a></li>\n<li>CAS Statistische Datenanalyse &amp; Datenvisualisierung</li>\n</ul>\n<p>#Kuration #Organisation #Publikation</p>"
      en: "<p>&nbsp;R &middot; Vue.js &middot; D3.js&nbsp;</p>\n<ul>\n<li>Based on data from <a href=\"https://data.snf.ch/datasets\" target=\"_blank\" rel=\"noopener\">SNF</a> and <a href=\"https://www.crossref.org/\" target=\"_blank\" rel=\"noopener\">Crossref</a></li>\n<li>CAS Statistical Data Analysis &amp; Data Visualization</li>\n</ul>\n<p>#Curation #Organization #Publication</p>"

  - url: https://parlament.kmapper.com/
    urlText: parlament.kmapper.com
    image: /images/project-parlament.png
    title:
      de: "Unterschiedliche Perspektiven auf das Schweizer Parlament"
