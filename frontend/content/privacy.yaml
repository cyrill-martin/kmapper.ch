title:
  de: "Datenschutz"
  en: "Privacy Policy"
content:
  de: "<p>Zuletzt aktualisiert am: 02.03.2026</p>\n<h3>1. Allgemeines</h3>\n<p>Der Schutz Ihrer personenbezogenen Daten ist uns wichtig. Diese Datenschutzerkl&auml;rung erl&auml;utert, welche personenbezogenen Daten wir auf unserer Website bearbeiten, zu welchen Zwecken wir dies tun und welche Rechte Sie haben. Wir richten uns nach dem schweizerischen Datenschutzgesetz (DSG) und der EU-Datenschutz-Grundverordnung (DSGVO), soweit anwendbar.</p>\n<h3>2. Verantwortliche Stelle</h3>\n<p>kmapper GmbH<br>Austrasse 52<br>4051 Basel<br>Schweiz</p>\n<p><strong>Website</strong>: <a href=\"https://kmapper.ch/\" target=\"_blank\" rel=\"noopener\">https://kmapper.ch/</a><br><strong>Telefon</strong>: <a href=\"tel:+41797456205\" target=\"_blank\" rel=\"noopener\">+41 79 745 62 05</a><br><strong>E-Mail</strong>: <a href=\"mailto:mail@kmapper.ch\" target=\"_blank\" rel=\"noopener\">mail@kmapper.ch</a></p>\n<p><strong>Datenschutzverantwortliche Person</strong>: Cyrill Martin<br><strong>E-Mail</strong>: <a href=\"mailto:cyrill.martin@kmapper.ch\" target=\"_blank\" rel=\"noopener\">cyrill.martin@kmapper.ch</a></p>\n<h3>3. Erhebung und Bearbeitung personenbezogener Daten</h3>\n<p>Wir bearbeiten personenbezogene Daten, die anfallen, wenn Sie:</p>\n<ul>\n<li>unsere Website besuchen</li>\n<li>mit uns per E-Mail, Telefon oder Video-Call kommunizieren</li>\n</ul>\n<p>Zu den bearbeiteten Daten geh&ouml;ren: Name, E-Mail-Adresse, Telefonnummer, E-Mail-Inhalt, Gespr&auml;chsnotizen sowie technische Daten als Teil von Server-Logs (IP-Adresse, Browser-Informationen, Zeitstempel, aufgerufene Seiten).&nbsp;</p>\n<h3>4. Zweck der Datenbearbeitung</h3>\n<p>Wir bearbeiten Ihre Daten zu folgenden Zwecken:</p>\n<ul>\n<li>Betrieb und Sicherheit der Website</li>\n<li>Beantwortung von Kontakt- und Gesch&auml;ftsanfragen</li>\n<li>Erf&uuml;llung gesetzlicher Aufbewahrungspflichten</li>\n</ul>\n<h3>5. Hosting</h3>\n<p>Unsere Website wird auf einem Virtual Private Server (VPS) bei <a href=\"https://www.infomaniak.com/\" target=\"_blank\" rel=\"noopener\">Infomaniak</a> (Schweiz, Serverstandort: Satigny GE) gehostet. Dabei werden technische Daten wie IP-Adresse, Browser-Informationen und Zeitstempel verarbeitet, die f&uuml;r den sicheren und stabilen Betrieb der Website erforderlich sind.</p>\n<h3>6. Keine Cookies oder Tracking</h3>\n<p>Diese Website verwendet keine Cookies, Analytics oder Tracking-Tools. Es findet keine Verhaltensanalyse oder Profiling statt.</p>\n<h3>7. Auftragsverarbeitung</h3>\n<p>Infomaniak (Hosting-Provider, Schweiz) verarbeitet technische Daten auf Infrastruktur-Ebene f&uuml;r den sicheren Betrieb des Servers.</p>\n<h3>8. Datenbekanntgabe</h3>\n<p>Eine Bekanntgabe der von kmapper erhobenen Gesch&auml;ftsdaten (Kontaktdaten, E-Mail-Inhalte, Gespr&auml;chsnotizen) erfolgt nur an Beh&ouml;rden bei gesetzlicher Verpflichtung.</p>\n<h3>9. Datenaufbewahrung</h3>\n<p>Wir speichern personenbezogene Daten wie folgt:</p>\n<ul>\n<li>Website-Logs: 12 Monate</li>\n<li>Gesch&auml;ftskommunikation: 10 Jahre (gesetzliche Aufbewahrungspflicht)</li>\n</ul>\n<h3>10. Datensicherheit</h3>\n<p>Wir treffen angemessene technische und organisatorische Massnahmen, um Ihre Daten vor unbefugtem Zugriff, Verlust oder Missbrauch zu sch&uuml;tzen.</p>\n<h3>11. Ihre Rechte</h3>\n<p>Sie haben im Rahmen des DSG und der DSGVO folgende Rechte:</p>\n<ul>\n<li>Auskunft &uuml;ber die zu Ihrer Person gespeicherten Daten</li>\n<li>Berichtigung unrichtiger Daten</li>\n<li>L&ouml;schung Ihrer Daten (soweit keine gesetzlichen Aufbewahrungspflichten bestehen)</li>\n<li>Einschr&auml;nkung der Verarbeitung und Daten&uuml;bertragbarkeit</li>\n<li>Widerspruch gegen die Verarbeitung</li>\n</ul>\n<p>Bitte richten Sie entsprechende Anfragen an: <a href=\"mailto:cyrill.martin@kmapper.ch\" target=\"_blank\" rel=\"noopener\">cyrill.martin@kmapper.ch</a></p>\n<p>Bei Beschwerden k&ouml;nnen Sie sich an den Eidgen&ouml;ssischen Datenschutz- und &Ouml;ffentlichkeitsbeauftragten wenden: <a href=\"https://www.edoeb.admin.ch/\" target=\"_blank\" rel=\"noopener\">www.edoeb.admin.ch</a></p>\n<h3>12. &Auml;nderungen dieser Datenschutzerkl&auml;rung</h3>\n<p>Wir k&ouml;nnen diese Datenschutzerkl&auml;rung jederzeit anpassen. Es gilt die jeweils auf der Website ver&ouml;ffentlichte Version.</p>"
  en: "<p>This website is operated under Swiss jurisdiction.&nbsp;<br>For privacy information, please refer to the German privacy policy:&nbsp;<a class=\"site-link\" href=\"/de/datenschutz\">Datenschutz</a></p>"

